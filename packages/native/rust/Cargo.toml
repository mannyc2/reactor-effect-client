[package]
name = "reactor-effect-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reactor-webrtc = { git = "https://github.com/reactor-team/reactor-webrtc.git", rev = "bebf63e42624ee440e066b692494dd3229d29ae7", version = "0.18.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Every unsafe block does one unsafe thing and says why it is sound.
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# A panic outside tests names the invariant that broke.
unwrap_used = "warn"
# A module with children is `name.rs` beside `name/`, never `name/mod.rs`.
mod_module_files = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
