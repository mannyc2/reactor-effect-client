# The native crate's dependency policy, which CI checks with
# `cargo deny --manifest-path packages/native/rust/Cargo.toml --locked check`.
#
# Every crate the addon links ships in its platform package, so its license
# must allow Apache-2.0 redistribution and be credited in notices/native-rust/.

[graph]
# The hosts scripts/build.sh can build for; the published platform packages
# are x86_64-unknown-linux-gnu and aarch64-apple-darwin.
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# A RustSec advisory against any locked crate fails the check. To accept one,
# list its ID here with the reason.
ignore = []

[licenses]
# ISC is libloading's, which napi links to resolve Node-API symbols at load.
allow = ["Apache-2.0", "ISC", "MIT", "Unicode-3.0"]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/reactor-team/reactor-webrtc"]
