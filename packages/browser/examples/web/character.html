<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Character · reactor-effect</title>
    <style>
      :root {
        --bg: #0b0d12;
        --panel: #12151d;
        --line: #232937;
        --text: #e7eaf2;
        --muted: #8a93a6;
        --accent: #8b7cff;
        --ok: #3ecf8e;
        --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      button,
      textarea,
      input {
        font: inherit;
        color: inherit;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 16px 20px 28px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
        gap: 16px;
      }
      h1 {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 20px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        display: grid;
        gap: 12px;
        align-content: start;
      }
      #character {
        width: 100%;
        height: 100%;
        min-height: 440px;
        display: block;
      }
      #character[hidden] {
        display: none;
      }
      .meter {
        height: 8px;
        border-radius: 4px;
        background: var(--line);
        overflow: hidden;
      }
      #level {
        height: 100%;
        width: 0;
        background: var(--ok);
      }
      .muted {
        color: var(--muted);
        margin: 0;
        font-size: 13px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      button {
        background: var(--line);
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 6px 14px;
        cursor: pointer;
      }
      button.on {
        border-color: var(--accent);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      textarea {
        width: 100%;
        min-height: 90px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px;
        resize: vertical;
      }
      #log {
        margin: 0;
        padding-left: 28px;
        font-family: var(--mono);
        font-size: 12px;
        max-height: 260px;
        overflow: auto;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Character</h1>
      <section class="panel">
        <canvas id="character" hidden></canvas>
        <div class="meter" title="What the speaker is playing now"><div id="level"></div></div>
        <p id="setup" class="muted"></p>
      </section>
      <section class="panel">
        <div class="row">
          <button id="avatar" type="button">Avatar</button>
          <button id="audio-only" type="button">Audio only</button>
          <span class="muted">State: <span id="state">idle</span></span>
        </div>
        <textarea id="text" maxlength="500">
Hello. I stay here between lines, and I speak whatever the server generates.</textarea>
        <div class="row">
          <button id="say" type="button">Say</button>
          <button id="stop" type="button">Stop</button>
          <label class="muted"
            >Play a local audio file <input id="file" type="file" accept="audio/*"
          /></label>
        </div>
        <p id="speech" class="muted"></p>
        <ol id="log" reversed></ol>
      </section>
    </main>
    <script type="module" src="/character.js"></script>
  </body>
</html>
