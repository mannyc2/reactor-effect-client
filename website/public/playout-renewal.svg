<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Playout keeps H3 on air across a session renewal</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="960" height="330" rx="16" fill="#16181d"/>

  <text x="32" y="44" fill="#eceef2" font-size="20" font-weight="600">One channel, two sessions, no dark air</text>
  <text x="32" y="68" fill="#888b96" font-size="14">Playout opens the next session before the current one reaches its cap, then switches at a clip boundary.</text>

  <!-- legend -->
  <g font-size="12" fill="#c0c2c7">
    <rect x="712" y="100" width="12" height="12" rx="3" fill="#22b8d6"/>
    <text x="730" y="111">airs on session 1</text>
    <rect x="832" y="100" width="12" height="12" rx="3" fill="#8b5cf6"/>
    <text x="850" y="111">on session 2</text>
  </g>

  <!-- sessions -->
  <text x="32" y="112" fill="#c0c2c7" font-size="13">session 1</text>
  <rect x="120" y="98" width="500" height="20" rx="5" fill="#24272f" stroke="#22b8d6" stroke-opacity="0.6"/>
  <text x="600" y="112" fill="#888b96" font-size="12" text-anchor="end">cap</text>
  <text x="32" y="148" fill="#c0c2c7" font-size="13">session 2</text>
  <rect x="440" y="134" width="496" height="20" rx="5" fill="#24272f" stroke="#8b5cf6" stroke-opacity="0.7"/>
  <text x="452" y="148" fill="#888b96" font-size="12">opened before session 1's cap</text>

  <!-- lead bracket -->
  <line x1="440" y1="170" x2="620" y2="170" stroke="#545861" stroke-dasharray="4 4"/>
  <text x="530" y="186" fill="#888b96" font-size="12" text-anchor="middle">renewal lead</text>

  <!-- on air -->
  <text x="32" y="232" fill="#c0c2c7" font-size="13">on air</text>
  <g font-size="12" fill="#16181d" font-weight="600">
    <rect x="120" y="212" width="98" height="30" rx="5" fill="#22b8d6"/>
    <text x="169" y="232" text-anchor="middle">viewer</text>
    <rect x="221" y="212" width="98" height="30" rx="5" fill="#545861"/>
    <text x="270" y="232" text-anchor="middle" fill="#eceef2">filler</text>
    <rect x="322" y="212" width="98" height="30" rx="5" fill="#22b8d6"/>
    <text x="371" y="232" text-anchor="middle">viewer</text>
    <rect x="423" y="212" width="98" height="30" rx="5" fill="#22b8d6"/>
    <text x="472" y="232" text-anchor="middle">viewer</text>
    <rect x="530" y="212" width="98" height="30" rx="5" fill="#8b5cf6"/>
    <text x="579" y="232" text-anchor="middle" fill="#eceef2">viewer</text>
    <rect x="631" y="212" width="98" height="30" rx="5" fill="#545861"/>
    <text x="680" y="232" text-anchor="middle" fill="#eceef2">filler</text>
    <rect x="732" y="212" width="98" height="30" rx="5" fill="#8b5cf6"/>
    <text x="781" y="232" text-anchor="middle" fill="#eceef2">viewer</text>
    <rect x="833" y="212" width="103" height="30" rx="5" fill="#8b5cf6"/>
    <text x="884" y="232" text-anchor="middle" fill="#eceef2">viewer</text>
  </g>

  <!-- switch marker -->
  <line x1="525.5" y1="92" x2="525.5" y2="252" stroke="url(#accent)" stroke-width="2"/>
  <circle cx="525.5" cy="252" r="4" fill="#8b5cf6"/>

  <!-- captions -->
  <text x="32" y="286" fill="#eceef2" font-size="13"><tspan font-weight="600">Switch at a clip boundary:</tspan> 420–432 ms on hosted H3</text>
  <text x="400" y="286" fill="#eceef2" font-size="13"><tspan font-weight="600">Clip-to-clip seams:</tspan> 46–169 ms, no dark frame</text>
  <text x="720" y="286" fill="#eceef2" font-size="13"><tspan font-weight="600">Filler</tspan> holds a runway</text>
  <text x="32" y="310" fill="#888b96" font-size="12">Hosted show check, September 28 and 29, 2026: three capped sessions a run. On September 28, 2,372 frames at 22.2 fps, none lost.</text>
</svg>
