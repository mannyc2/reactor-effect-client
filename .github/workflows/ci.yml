name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"
  NODE_VERSION: "24.15.0"
  PYTHON_VERSION: "3.13.5"
  RUST_VERSION: "1.90.0"

jobs:
  check:
    name: Portable verification
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up pinned wire generator runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Generation, format, lint, dependency-ordered build, every workspace's
      # typecheck, architecture, compiled examples, portable tests and the
      # Node/Bun import guards. Runs once; nothing here varies by host.
      - name: Shared portable verification
        run: bun run verify --profile portable

      - name: Install isolated release tooling
        run: bun install --cwd release-tools --frozen-lockfile --ignore-scripts

      - name: Check release application and workflow guards
        run: bun run check:release

  test:
    name: Portable runtime (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            node: "22.22.2"
          - os: ubuntu-24.04
            node: "24.15.0"
          - os: macos-15
            node: "24.15.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      # Only the parts whose outcome can depend on the host: the build, the
      # Node/Bun runtime import guards and the portable test suites.
      - name: Portable runtime verification
        run: bun run verify --profile runtime

  native:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
          - os: macos-15
            platform: darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      # The staged library embeds the SHA-256 of every native build input. On a
      # pull request, a library qualified for the same inputs, build recipe,
      # toolchain and runner image is reused; the staging and preflight checks
      # still reject a library whose identity differs from the checked-out
      # sources. A main run always builds the library it qualifies.
      - name: Compute native cache key
        id: identity
        shell: bash
        run: |
          source=$(node packages/native/scripts/stage.mjs --source-hash)
          recipe='${{ hashFiles('packages/native/scripts/build.sh', 'packages/native/scripts/stage.sh', 'packages/native/scripts/stage.mjs', 'packages/native/scripts/install-linux-toolchain.sh', 'packages/native/Dockerfile') }}'
          echo "key=native-${{ matrix.platform }}-rust${{ env.RUST_VERSION }}-image${ImageVersion:-unknown}-source${source}-recipe${recipe}" >> "$GITHUB_OUTPUT"

      - name: Restore qualified native library
        id: staged
        if: github.ref != 'refs/heads/main'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/native/lib/${{ matrix.platform }}
          key: ${{ steps.identity.outputs.key }}

      - name: Set up Rust
        if: steps.staged.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal --component clippy --component rustfmt
          rustup override set ${{ env.RUST_VERSION }}
          rustc --version
          cargo --version

      - name: Install Linux LLVM 21 native toolchain
        if: steps.staged.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo ./packages/native/scripts/install-linux-toolchain.sh
          sudo apt-get install -y --no-install-recommends zstd

      - name: Ensure macOS zstd is available
        if: steps.staged.outputs.cache-hit != 'true' && runner.os == 'macOS'
        shell: bash
        run: command -v zstd >/dev/null || brew install zstd

      - name: Cache Cargo registry and build outputs
        if: steps.staged.outputs.cache-hit != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/rust/target
          key: cargo-${{ matrix.platform }}-rust${{ env.RUST_VERSION }}-${{ hashFiles('packages/native/rust/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.platform }}-rust${{ env.RUST_VERSION }}-

      - name: Build, stage and qualify the native library
        if: steps.staged.outputs.cache-hit != 'true'
        run: |
          bun run native:build
          bun run native:test

      - name: Save qualified native library
        if: steps.staged.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: packages/native/lib/${{ matrix.platform }}
          key: ${{ steps.identity.outputs.key }}

      - name: Check the restored library against the current sources
        if: steps.staged.outputs.cache-hit == 'true'
        run: bun run --filter reactor-effect-native test

      - name: Public browser/native WebRTC verification
        run: bun run test:integration

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: packages/native/lib/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 1

  package:
    name: Pack/install smoke
    runs-on: ubuntu-24.04
    needs: [check, native]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun package downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download Linux native artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-linux-x64
          path: packages/native/lib/linux-x64

      - name: Download macOS native artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-darwin-arm64
          path: packages/native/lib/darwin-arm64

      - name: Clean pack/install validation
        id: package
        env:
          PACK_EXPECT_NATIVE_PLATFORMS: linux-x64,darwin-arm64
        run: bun run verify --profile package

      - name: Install isolated release tooling
        if: github.ref == 'refs/heads/main'
        run: bun install --cwd release-tools --frozen-lockfile --ignore-scripts

      - name: Bind qualified archives to this main CI run
        id: qualification
        if: github.ref == 'refs/heads/main'
        env:
          PACKAGE_IDENTITY: ${{ steps.package.outputs.identity }}
        run: node release-tools/ci.mjs stamp "$PACKAGE_IDENTITY" .release/qualified/qualification.json

      - name: Stage a flat artifact without changing package bytes
        env:
          PACKAGE_DIRECTORY: ${{ steps.package.outputs.directory }}
          PACKAGE_IDENTITY: ${{ steps.package.outputs.identity }}
        run: |
          mkdir -p .release/qualified
          cp "$PACKAGE_DIRECTORY"/*.tgz "$PACKAGE_IDENTITY" .release/qualified/

      - name: Upload validated npm packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: .release/qualified/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
