name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js-smoke:
    name: JS smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        node: ["22.22.2", "24.15.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up pinned wire generator runtime
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13.5"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Shared portable verification
        run: bun run verify --profile portable

      - name: Install isolated release tooling
        run: bun install --cwd release-tools --frozen-lockfile --ignore-scripts

      - name: Check release application and workflow guards
        run: bun run check:release

  native:
    name: Native (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x64
            library: libreactor_effect_native.so
          - os: macos-15
            platform: darwin-arm64
            library: libreactor_effect_native.dylib
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Set up Rust 1.90
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy --component rustfmt
          rustup override set 1.90.0
          rustc --version
          cargo --version

      - name: Install Linux LLVM 21 native toolchain
        if: runner.os == 'Linux'
        run: |
          sudo ./native/install-linux-toolchain.sh
          sudo apt-get install -y --no-install-recommends zstd

      - name: Ensure macOS zstd is available
        if: runner.os == 'macOS'
        shell: bash
        run: command -v zstd >/dev/null || brew install zstd

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Shared native and public WebRTC verification
        run: bun run verify --profile native

      - name: Upload native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.platform }}
          path: dist/native/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 1

  package:
    name: npm pack/install smoke
    runs-on: ubuntu-24.04
    needs: [js-smoke, native]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Download Linux native artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-linux-x64
          path: dist/native/linux-x64

      - name: Download macOS native artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: native-darwin-arm64
          path: dist/native/darwin-arm64

      - name: Clean npm pack/install validation
        id: package
        env:
          PACK_EXPECT_NATIVE_PLATFORMS: linux-x64,darwin-arm64
        run: bun run verify --profile package

      - name: Install isolated release tooling
        if: github.ref == 'refs/heads/main'
        run: bun install --cwd release-tools --frozen-lockfile --ignore-scripts

      - name: Bind qualified archive to this main CI run
        id: qualification
        if: github.ref == 'refs/heads/main'
        env:
          PACKAGE_IDENTITY: ${{ steps.package.outputs.identity }}
        run: node release-tools/ci.mjs stamp "$PACKAGE_IDENTITY" .release/qualified/qualification.json

      - name: Stage a flat artifact without changing package bytes
        env:
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.tarball }}
          PACKAGE_IDENTITY: ${{ steps.package.outputs.identity }}
        run: |
          mkdir -p .release/qualified
          cp "$PACKAGE_ARCHIVE" "$PACKAGE_IDENTITY" .release/qualified/

      - name: Upload validated npm tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: .release/qualified/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
