name: Release npm with ts-release

# Preparation and publication are separate manual runs. Neither builds the SDK.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Prepare a candidate, publish a retained candidate, or observe recovery
        required: true
        type: choice
        default: prepare
        options: [prepare, publish, observe]
      ci_run_id:
        description: Successful CI run on this repository's main that produced npm-package
        required: true
        type: string
      candidate_run_id:
        description: Successful prepare run holding ts-release-candidate (required for publish/observe)
        required: false
        type: string
      confirm:
        description: For publish only, enter "publish reactor-effect-client@<exact-version>"
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: reactor-npm-release
  cancel-in-progress: false

env:
  CI_RUN_ID: ${{ inputs.ci_run_id }}
  CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  RELEASE_MODE: ${{ inputs.mode }}

jobs:
  select:
    name: Validate main workflow and source runs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      application-commit: ${{ steps.selection.outputs.application-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd release-tools --frozen-lockfile --ignore-scripts
      - name: Read exact workflow-run identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p .release
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > .release/ci-run.json
          if [ "$RELEASE_MODE" != prepare ]; then
            [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" > .release/candidate-run.json
          fi
      - name: Reject failed, fork, pull-request or wrong-workflow artifacts
        id: selection
        run: |
          if [ "$RELEASE_MODE" = prepare ]; then
            node release-tools/ci.mjs select .release/ci-run.json
          else
            node release-tools/ci.mjs select .release/ci-run.json .release/candidate-run.json
          fi

  prepare:
    name: Retain qualified archive as a ts-release Bundle and Plan
    needs: select
    if: inputs.mode == 'prepare'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd release-tools --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: npm-package
          path: .release/qualified
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Read selected successful CI run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > .release/ci-run.json
      - name: Prepare locally without credentials, journal writes or publication
        run: node release-tools/prepare.mjs .release/qualified .release/candidate .release/ci-run.json > .release/prepare-report.json
      - name: Retain original Bundle, Plan, qualification and owned bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts-release-candidate
          path: .release/candidate/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Show candidate identities for review
        run: |
          printf '### Prepared candidate (not published)\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat .release/prepare-report.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\nUse this run ID as candidate_run_id in a separate manual publish run.\n' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Execute or observe the original candidate
    needs: select
    if: inputs.mode == 'publish' || inputs.mode == 'observe'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write # Git CAS journal only; publication itself uses NPM_TOKEN.
    steps:
      - name: Restore the release application from the reviewed preparation run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.select.outputs.application-commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --cwd release-tools --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ts-release-candidate
          path: .release/candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Read original CI source identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > .release/ci-run.json
      - name: Bind explicit approval to the retained package and version
        id: input
        env:
          CONFIRM: ${{ inputs.confirm }}
          NPM_TOKEN: ${{ inputs.mode == 'publish' && secrets.NPM_TOKEN || '' }}
        run: node release-tools/input.mjs .release/candidate .release/ci-run.json .release/input.json
      - name: Execute the pinned ts-release Action over the durable journal
        id: release
        uses: mannyc2/ts-release/apps/action@3f64048fe4dd75fb3e853d6d3e048e4b635a1b1a # v0.4.1
        with:
          application: release-tools/application.mjs
          input: ${{ steps.input.outputs.application-input }}
          observe: ${{ inputs.mode == 'observe' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_TOKEN: ${{ inputs.mode == 'publish' && secrets.NPM_TOKEN || '' }}
      - name: Retain fresh observations without replaying publication
        if: ${{ always() && steps.input.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node release-tools/report.mjs .release/input.json .release/report.json
      - name: Retain recovery report
        if: ${{ always() && steps.input.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts-release-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .release/report.json
            .release/candidate/identity.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
