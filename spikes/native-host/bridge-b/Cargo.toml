[package]
name = "reactor-effect-native-b"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
reactor-webrtc = { git = "https://github.com/reactor-team/reactor-webrtc.git", rev = "bebf63e42624ee440e066b692494dd3229d29ae7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
